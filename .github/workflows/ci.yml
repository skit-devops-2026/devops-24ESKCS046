name: Zenith CI

on:
  push:
  branches:
    - main
    - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: make install

      - name: Run automated tests
        run: make test

      - name: Build project
        run: make build